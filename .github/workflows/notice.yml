name: CSVTU Notice Alert

on:
  schedule:
    - cron: '*/10 * * * *'  # adjust as needed
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4.2.2        # updated

      - uses: actions/setup-python@v5.6.0    # updated
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run script
        env:
          EMAIL: ${{ secrets.EMAIL }}
          PASSWORD: ${{ secrets.PASSWORD }}
        run: python main.py